pandoc: '3.2'
pkgdown: 2.2.0
pkgdown_sha: ~

template:
  bootstrap: 5
  bootswatch: cosmo

navbar:
  structure:
    left: [reference, articles, tutorials]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/palakorn-seenoi/LHmom
      aria-label: GitHub

home:
  title: "LHmom: Higher-order L-Moment Estimation"
  description: >
    Computes sample and theoretical Linear Higher-Order Moments (LH-moments)
    and implements parameter estimation for various statistical distributions,
    including the Generalized Extreme Value (GEV), Generalized Logistic (GLO),
    Generalized Pareto (GPA), Generalized Normal (GNO), Pearson Type III (PE3),
    and Kappa distributions.

    It also provides analytical tools such as
    Wang's goodness-of-fit test.

    The design, parameterization, and output
    structures of this package closely follow the style and conventions of the
    'lmomco' package to ensure a familiar and consistent interface for users
    accustomed to L-moment calculations in R.

url: https://palakorn-seenoi.github.io/LHmom/
